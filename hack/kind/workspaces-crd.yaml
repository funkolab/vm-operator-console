# Minimal stand-in for NKP's Kommander Workspace API, so the console's
# workspace selector can be developed and tested on kind. Only the fields the
# console reads are modelled (display name annotation, namespaceName).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workspaces.workspaces.kommander.mesosphere.io
spec:
  group: workspaces.kommander.mesosphere.io
  scope: Cluster
  names:
    kind: Workspace
    plural: workspaces
    singular: workspace
    shortNames: [ws]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Display Name
          type: string
          jsonPath: .metadata.annotations.kommander\.mesosphere\.io/display-name
        - name: Workspace Namespace
          type: string
          jsonPath: .spec.namespaceName
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                namespaceName:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
