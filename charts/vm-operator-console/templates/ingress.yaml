{{- with .Values.ingress.traefik }}
{{- if .enabled }}
# NKP: Traefik IngressRoute protected by the remote-auth (forward-auth)
# middleware, which authenticates the user and forwards the identity headers.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "vmc.fullname" $ }}
  labels:
    {{- include "vmc.labels" $ | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: {{ if .host }}Host(`{{ .host }}`) && {{ end }}PathPrefix(`{{ .pathPrefix }}`)
      {{- with .middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ include "vmc.fullname" $ }}
          port: {{ $.Values.service.port }}
  {{- if .tls.enabled }}
  tls:
    {{- with .tls.secretName }}
    secretName: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- with .Values.ingress.standard }}
{{- if .enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vmc.fullname" $ }}
  labels:
    {{- include "vmc.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "vmc.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
