apiVersion: v1
kind: Pod
metadata:
  name: {{ include "vmc.fullname" . }}-test
  labels:
    {{- include "vmc.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: readyz
      image: curlimages/curl:8.11.1
      args: ["-fsS", "--max-time", "10", "http://{{ include "vmc.fullname" . }}:{{ .Values.service.port }}{{ .Values.basePath }}/readyz"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
