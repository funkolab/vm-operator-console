# All tooling and tasks for vm-operator-console. Run `mise tasks` to list them.

[tools]
bun = "1.3"
kubectl = "1.33"
helm = "3"
kind = "latest"
yq = "latest"

[env]
KIND_CLUSTER = "vm-console-dev"
KUBE_CONTEXT = "kind-vm-console-dev"
OPERATOR_DIR = "{{config_root}}/../vm-operator"
IMAGE_REPO = "vm-operator-console"
IMAGE_TAG = "dev"
CHART_DIR = "{{config_root}}/charts/vm-operator-console"
RELEASE_NS = "vm-console"
_.file = { path = ".env.local", redact = false }

# ---------------------------------------------------------------- setup

[tasks.install]
description = "Install JavaScript dependencies"
run = "bun install"
sources = ["package.json", "*/*/package.json", "e2e/package.json", "bun.lock"]
outputs = { auto = true }

[tasks."gen:schemas"]
description = "Generate Zod schemas and field docs from the vm-operator CRDs"
depends = ["install"]
run = "bun scripts/gen-crd-schemas.ts \"$OPERATOR_DIR\""
sources = ["scripts/gen-crd-schemas.ts", "{{env.OPERATOR_DIR}}/config/crd/bases/*.yaml"]
outputs = ["packages/shared/src/crd/generated.ts", "packages/shared/src/crd/docs.generated.ts"]

# ---------------------------------------------------------------- dev

[tasks.dev]
description = "Run the API (kubeconfig, dev identity) and the Vite dev server with hot reload"
depends = ["install"]
run = [{ tasks = ["dev:server", "dev:web"] }]

[tasks."dev:server"]
description = "Run the Hono API in watch mode against the current kubeconfig context"
dir = "apps/server"
env = { AUTH_MODE = "dev", DEV_USER = "alice", DEV_GROUPS = "team-a-admins", PORT = "8080", LOG_LEVEL = "debug" }
run = "bun --watch src/index.ts"

[tasks."dev:web"]
description = "Run the Vite dev server (proxies /api to :8080)"
dir = "apps/web"
run = "bunx --bun vite --host"

[tasks.start]
description = "Run the production build locally (server serves the built SPA)"
depends = ["build:web"]
dir = "apps/server"
env = { AUTH_MODE = "dev", DEV_USER = "alice", DEV_GROUPS = "team-a-admins" }
run = "bun src/index.ts"

# ---------------------------------------------------------------- quality

[tasks.lint]
description = "Lint and format check (Biome)"
depends = ["install"]
run = "bunx --bun biome check ."

[tasks.format]
description = "Format and apply safe lint fixes"
run = "bunx --bun biome check --write ."

[tasks.typecheck]
description = "Type-check every workspace"
depends = ["install"]
run = [
  "cd packages/shared && bunx --bun tsc -p tsconfig.json",
  "cd apps/server && bunx --bun tsc -p tsconfig.json",
  "cd apps/web && bun scripts/gen-routes.ts && bunx --bun tsc -p tsconfig.json",
  "cd e2e && bunx --bun tsc -p tsconfig.json",
]

[tasks.test]
description = "Run unit tests (shared rules/templates + server)"
depends = ["install"]
run = ["cd packages/shared && bun test", "cd apps/server && bun test test/unit"]

[tasks."test:e2e"]
description = "Run Playwright end-to-end tests (in the Playwright container) against BASE_URL"
depends = ["install"]
env = { BASE_URL = "http://127.0.0.1:8080" }
run = "hack/playwright.sh bun --bun x playwright test"

[tasks."test:e2e:cluster"]
description = "Run the e2e suite against the Helm-deployed console in kind (through the fake auth proxy)"
depends = ["helm:deploy"]
run = """
kubectl --context $KUBE_CONTEXT -n $RELEASE_NS port-forward svc/fake-auth 8092:80 >/dev/null 2>&1 &
PF=$!; trap 'kill $PF' EXIT; sleep 3
BASE_URL=http://127.0.0.1:8092 hack/playwright.sh bun --bun x playwright test
"""

[tasks.ci]
description = "Everything CI runs: lint, typecheck, tests, builds, chart lint, image"
run = [
  { tasks = ["lint", "typecheck", "test"] },
  { tasks = ["build", "helm:lint"] },
  { task = "docker:build" },
]

# ---------------------------------------------------------------- build

[tasks.build]
description = "Build the SPA and the single-file server binary"
run = [{ task = "build:web" }, { task = "build:server" }]

[tasks."build:web"]
description = "Build the React SPA (apps/web/dist)"
depends = ["install"]
dir = "apps/web"
run = "bunx --bun vite build"
sources = ["apps/web/src/**/*", "apps/web/index.html", "apps/web/vite.config.ts", "packages/shared/src/**/*"]
outputs = ["apps/web/dist/index.html"]

[tasks."build:server"]
description = "Compile the Hono server to a standalone binary (dist/vm-operator-console + dist/public)"
depends = ["install", "build:web"]
run = [
  "cd apps/server && bun build src/index.ts --compile --minify --sourcemap --outfile ../../dist/vm-operator-console",
  "rm -rf dist/public && cp -r apps/web/dist dist/public",
]

# ---------------------------------------------------------------- container & chart

[tasks."docker:build"]
description = "Build the container image"
run = "docker build --build-arg VERSION=$IMAGE_TAG --build-arg REVISION=$(git rev-parse --short HEAD 2>/dev/null || echo unknown) -t $IMAGE_REPO:$IMAGE_TAG ."

[tasks."docker:push"]
description = "Build and push a multi-arch image (set IMAGE_REPO to a registry)"
run = "docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION=$IMAGE_TAG -t $IMAGE_REPO:$IMAGE_TAG --push ."

[tasks."helm:lint"]
description = "Lint the Helm chart and validate the rendered manifests"
run = [
  "helm lint $CHART_DIR --strict",
  "helm template ci $CHART_DIR > /dev/null",
  "helm template ci $CHART_DIR -f hack/kind/helm-values.yaml > /dev/null",
]

[tasks."helm:package"]
description = "Package the Helm chart into dist/"
run = "mkdir -p dist && helm package $CHART_DIR -d dist"

[tasks."helm:template"]
description = "Render the chart with the kind values"
run = "helm template vm-operator-console $CHART_DIR -n $RELEASE_NS -f hack/kind/helm-values.yaml"

# ---------------------------------------------------------------- kind

[tasks."kind:up"]
description = "Create the local kind cluster"
run = "kind get clusters | grep -qx $KIND_CLUSTER || kind create cluster --name $KIND_CLUSTER --wait 120s"

[tasks."kind:down"]
description = "Delete the local kind cluster"
run = "kind delete cluster --name $KIND_CLUSTER"

[tasks."kind:crds"]
description = "Install the vm-operator CRDs and ValidatingAdmissionPolicies into kind"
depends = ["kind:up"]
run = [
  "kubectl --context $KUBE_CONTEXT apply -k $OPERATOR_DIR/config/crd",
  "kubectl --context $KUBE_CONTEXT apply -k $OPERATOR_DIR/config/vap",
  "kubectl --context $KUBE_CONTEXT wait --for=condition=Established crd --all --timeout=60s",
]

[tasks."kind:seed"]
description = "Create test namespaces, users (alice/bob/carol), RBAC, contexts, VMs and simulated status"
depends = ["kind:crds"]
run = [
  "kubectl --context $KUBE_CONTEXT apply -f hack/kind/rbac-roles.yaml",
  "kubectl --context $KUBE_CONTEXT apply -f hack/kind/seed.yaml",
  "bun hack/kind/fake-status.ts --context $KUBE_CONTEXT",
]

[tasks."kind:fake-operator"]
description = "Simulate vm-operator status updates (power state, addresses…) while developing"
run = "bun hack/kind/fake-status.ts --context $KUBE_CONTEXT --follow"

[tasks."kind:load"]
description = "Load the container image into kind"
depends = ["docker:build"]
run = "kind load docker-image $IMAGE_REPO:$IMAGE_TAG --name $KIND_CLUSTER"

[tasks."helm:deploy"]
description = "Deploy the chart into kind with a fake Traefik remote-auth proxy"
depends = ["kind:load", "kind:seed"]
run = [
  "kubectl --context $KUBE_CONTEXT create namespace $RELEASE_NS --dry-run=client -o yaml | kubectl --context $KUBE_CONTEXT apply -f -",
  "helm --kube-context $KUBE_CONTEXT upgrade --install vm-operator-console $CHART_DIR -n $RELEASE_NS -f hack/kind/helm-values.yaml --set image.tag=$IMAGE_TAG --wait --timeout 3m",
  "kubectl --context $KUBE_CONTEXT -n $RELEASE_NS rollout restart deploy/vm-operator-console",
  "kubectl --context $KUBE_CONTEXT -n $RELEASE_NS rollout status deploy/vm-operator-console --timeout=120s",
  "kubectl --context $KUBE_CONTEXT apply -f hack/kind/fake-auth.yaml",
  "kubectl --context $KUBE_CONTEXT -n $RELEASE_NS rollout status deploy/fake-auth --timeout=120s",
  "helm --kube-context $KUBE_CONTEXT test vm-operator-console -n $RELEASE_NS",
]

[tasks."helm:undeploy"]
description = "Remove the console from kind"
run = [
  "kubectl --context $KUBE_CONTEXT delete -f hack/kind/fake-auth.yaml --ignore-not-found",
  "helm --kube-context $KUBE_CONTEXT uninstall vm-operator-console -n $RELEASE_NS --ignore-not-found",
]

[tasks."kind:open"]
description = "Port-forward the in-cluster console (via the fake auth proxy) to http://localhost:8092"
run = "kubectl --context $KUBE_CONTEXT -n $RELEASE_NS port-forward svc/fake-auth 8092:80"
